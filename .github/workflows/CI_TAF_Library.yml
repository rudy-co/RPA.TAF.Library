name: TAF Library CI

# Build -> Publish -> Notify consumers.
# Versioning: MAJOR.MINOR from project.json, PATCH = last git tag vMAJOR.MINOR.* + 1.
#   Production only = 1.1.x | PR = build only | Development & UAT = skipped
# Full runbook: docs/CICD.md

on:
  push:
    branches: [Production]
    paths-ignore: ["docs/**", "ci-templates/**", "**/*.md"]
  pull_request:
    branches: [Production]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit version (e.g. 1.2.3)"
        required: false

concurrency:
  group: taf-library-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLI_VERSION: "1.202.1"
  PACKAGE_NAME: "TAF.Library"
  OUTPUT_DIR: "dist"

defaults:
  run:
    shell: bash

jobs:

  # ---------------------------------------------------------
  # BUILD: version, restore, analyze, pack
  # ---------------------------------------------------------
  build:
    name: Build
    if: github.ref_name == 'Production' || github.base_ref == 'Production'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/npm-cache
          key: npm-${{ runner.os }}-uipath-cli-${{ env.CLI_VERSION }}

      - name: Install UiPath CLI
        run: npm install -g --prefer-offline --no-audit --no-fund "@uipath/cli@${CLI_VERSION}" && uip --version

      - name: Determine version
        id: version
        env:
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BASE=$(jq -r '.projectVersion' project.json | cut -d. -f1,2)
          EXISTING=$(git tag --points-at HEAD --list "v${BASE}.*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          LAST=$(git tag --list "v${BASE}.*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)

          if [ -n "$EXISTING" ]; then VERSION="${EXISTING#v}"
          elif [ -n "$LAST" ]; then VERSION="${BASE}.$(( ${LAST##*.} + 1 ))"
          else VERSION="${BASE}.0"
          fi

          if [ -n "$EXPLICIT" ]; then VERSION="$EXPLICIT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then VERSION="${VERSION}-pr.${{ github.event.number }}"
          fi

          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Key on the dependency list only (not the whole project.json), so a
      # projectVersion bump doesn't throw away the cache.
      - name: Compute dependency hash
        id: deps
        run: echo "hash=$(jq -cS '.dependencies' project.json | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Activity packages (UIAutomation, System, Excel, ...) are hundreds of MB;
      # without this every run re-downloads them all.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ steps.deps.outputs.hash }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: uip rpa restore .

      - name: Analyze
        if: vars.ENABLE_ANALYZER == 'true'
        run: uip rpa analyze .

      # Output must be OUTSIDE the project folder, so use the runner temp dir.
      - name: Pack
        run: |
          OUT="$(cygpath -m "$RUNNER_TEMP")/$OUTPUT_DIR"
          mkdir -p "$OUT"
          uip rpa pack . "$OUT" --package-version "${{ steps.version.outputs.version }}" --skip-analyze

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/${{ env.OUTPUT_DIR }}/*.nupkg
          if-no-files-found: error

  # ---------------------------------------------------------
  # PUBLISH: push package to Orchestrator (not for PRs)
  # ---------------------------------------------------------
  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: uipath-prod
    permissions:
      contents: write

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install UiPath CLI
        run: npm install -g "@uipath/cli@${CLI_VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/${{ env.OUTPUT_DIR }}

      - name: Login and publish
        env:
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_ORG: ${{ vars.UIPATH_ORG }}
          UIPATH_TENANT: ${{ vars.UIPATH_TENANT }}
          UIPATH_URL: ${{ vars.UIPATH_URL || 'https://cloud.uipath.com' }}
          UIPATH_SCOPE: ${{ vars.UIPATH_SCOPE || 'OR.Execution OR.Folders.Read' }}
          UIPATH_LIBRARY_FEED_ID: ${{ vars.UIPATH_LIBRARY_FEED_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for v in UIPATH_CLIENT_ID UIPATH_CLIENT_SECRET UIPATH_ORG UIPATH_TENANT UIPATH_LIBRARY_FEED_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is empty for environment '${{ github.ref_name }}'"
              exit 1
            fi
          done

          uip login --authority "$UIPATH_URL" \
            --organization "$UIPATH_ORG" \
            --tenant "$UIPATH_TENANT" \
            --client-id "$UIPATH_CLIENT_ID" \
            --client-secret "$UIPATH_CLIENT_SECRET" \
            --scope "$UIPATH_SCOPE" \
            --output json

          NUPKG=$(ls "$(cygpath -m "$RUNNER_TEMP")/$OUTPUT_DIR"/*.nupkg | head -1)
          echo "Uploading $NUPKG -> feed $UIPATH_LIBRARY_FEED_ID"

          TAG="v${{ needs.build.outputs.version }}"

          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG sudah ada, upload di-skip"
          else
            RC=0
            RESULT=$(uip or libraries upload --file "$NUPKG" --feed-id "$UIPATH_LIBRARY_FEED_ID" --output json 2>&1) || RC=$?
            echo "$RESULT"
            if [ "$RC" -ne 0 ]; then
              echo "$RESULT" | grep -qiE "already exist|conflict" || exit "$RC"
              echo "::warning::${{ needs.build.outputs.version }} sudah ada di feed, lanjut membuat tag"
            fi

            gh api "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="${{ github.sha }}"
          fi

          echo "Published $PACKAGE_NAME ${{ needs.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

