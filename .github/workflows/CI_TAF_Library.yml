name: TAF Library CI

# Build -> Upload -> Verify -> Tag -> Notify consumers.
# Versioning: version = projectVersion from project.json, used as-is
#   (e.g. projectVersion 1.1.4 -> TAF.Library 1.1.4, git tag v1.1.4).
#   Bump projectVersion for every release; the pipeline fails if that version was already released.
#   Production = publish | PR = build only (version-pr.N) | Development & UAT = skipped
# Full runbook: docs/CICD.md

on:
  push:
    branches: [Production]
    paths-ignore: ["docs/**", "ci-templates/**", "**/*.md"]
  pull_request:
    branches: [Production]
  workflow_dispatch:

concurrency:
  group: taf-library-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLI_VERSION: "1.202.1"
  PACKAGE_NAME: "TAF.Library"
  OUTPUT_DIR: "dist"

defaults:
  run:
    shell: bash

jobs:

  # ---------------------------------------------------------
  # BUILD: version, restore, analyze, pack
  # ---------------------------------------------------------
  build:
    name: Build
    if: github.ref_name == 'Production' || github.base_ref == 'Production'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/npm-cache
          key: npm-${{ runner.os }}-uipath-cli-${{ env.CLI_VERSION }}

      - name: Install UiPath CLI
        run: npm install -g --prefer-offline --no-audit --no-fund "@uipath/cli@${CLI_VERSION}" && uip --version

      # Version is taken as-is from projectVersion in project.json.
      # To release a new version, bump projectVersion before merging to Production.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.projectVersion // empty' project.json | tr -d '\r')

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::projectVersion '$VERSION' in project.json is not a valid version (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi

          # A version can only be released from one commit. Re-running on the
          # already-tagged commit is fine; any other commit must bump the version.
          TAGGED_SHA=$(git rev-parse -q --verify "refs/tags/v${VERSION}^{commit}" || true)
          if [ -n "$TAGGED_SHA" ] && [ "$TAGGED_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Version $VERSION was already released from commit $TAGGED_SHA. Bump projectVersion in project.json."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="${VERSION}-pr.${{ github.event.number }}"
          fi

          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Key on the dependency list only (not the whole project.json), so a
      # projectVersion bump doesn't throw away the cache.
      - name: Compute dependency hash
        id: deps
        run: echo "hash=$(jq -cS '.dependencies' project.json | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Activity packages (UIAutomation, System, Excel, ...) are hundreds of MB;
      # without this every run re-downloads them all.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ steps.deps.outputs.hash }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: uip rpa restore .

      - name: Analyze
        if: vars.ENABLE_ANALYZER == 'true'
        run: uip rpa analyze .

      # Output must be OUTSIDE the project folder, so use the runner temp dir.
      - name: Pack
        run: |
          OUT="$(cygpath -m "$RUNNER_TEMP")/$OUTPUT_DIR"
          mkdir -p "$OUT"
          uip rpa pack . "$OUT" --package-version "${{ steps.version.outputs.version }}" --skip-analyze

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/${{ env.OUTPUT_DIR }}/*.nupkg
          if-no-files-found: error

  # ---------------------------------------------------------
  # PUBLISH: upload package to the library feed (not for PRs)
  # ---------------------------------------------------------
  publish:
    name: Upload package
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: uipath-prod

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install UiPath CLI
        run: npm install -g "@uipath/cli@${CLI_VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/${{ env.OUTPUT_DIR }}

      - name: Login and upload
        env:
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_ORG: ${{ vars.UIPATH_ORG }}
          UIPATH_TENANT: ${{ vars.UIPATH_TENANT }}
          UIPATH_URL: ${{ vars.UIPATH_URL || 'https://cloud.uipath.com' }}
          UIPATH_SCOPE: ${{ vars.UIPATH_SCOPE || 'OR.Execution OR.Folders.Read' }}
          UIPATH_LIBRARY_FEED_ID: ${{ vars.UIPATH_LIBRARY_FEED_ID }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          for v in UIPATH_CLIENT_ID UIPATH_CLIENT_SECRET UIPATH_ORG UIPATH_TENANT UIPATH_LIBRARY_FEED_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is empty for environment '${{ github.ref_name }}'"
              exit 1
            fi
          done

          uip login --authority "$UIPATH_URL" \
            --organization "$UIPATH_ORG" \
            --tenant "$UIPATH_TENANT" \
            --client-id "$UIPATH_CLIENT_ID" \
            --client-secret "$UIPATH_CLIENT_SECRET" \
            --scope "$UIPATH_SCOPE" \
            --output json

          # Pick the file by its exact name, not "the first .nupkg found".
          NUPKG="$(cygpath -m "$RUNNER_TEMP")/$OUTPUT_DIR/${PACKAGE_NAME}.${VERSION}.nupkg"
          if [ ! -f "$NUPKG" ]; then
            echo "::error::$(basename "$NUPKG") not found in the build artifact"
            ls -la "$(dirname "$NUPKG")"
            exit 1
          fi

          KEY="${PACKAGE_NAME}:${VERSION}"

          if uip or libraries get "$KEY" --feed-id "$UIPATH_LIBRARY_FEED_ID" --output json >/dev/null 2>&1; then
            echo "::notice::$KEY already exists in the feed, skipping upload (package content is checked in the verify job)"
          else
            echo "Uploading $NUPKG -> feed $UIPATH_LIBRARY_FEED_ID"
            RC=0
            RESULT=$(uip or libraries upload --file "$NUPKG" --feed-id "$UIPATH_LIBRARY_FEED_ID" --output json 2>&1) || RC=$?
            echo "$RESULT"
            if [ "$RC" -ne 0 ]; then
              echo "$RESULT" | grep -qiE "already exist|conflict" || exit "$RC"
              echo "::warning::$KEY already exists in the feed, continuing to verification"
            fi
          fi

          echo "Uploaded $KEY to feed $UIPATH_LIBRARY_FEED_ID" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------
  # VERIFY: make sure the version is actually available in the target feed
  # ---------------------------------------------------------
  verify-published-package:
    name: Verify published package
    needs: [build, publish]
    runs-on: windows-latest
    environment: uipath-prod

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install UiPath CLI
        run: npm install -g "@uipath/cli@${CLI_VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/${{ env.OUTPUT_DIR }}

      - name: Login and verify package in feed
        env:
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_ORG: ${{ vars.UIPATH_ORG }}
          UIPATH_TENANT: ${{ vars.UIPATH_TENANT }}
          UIPATH_URL: ${{ vars.UIPATH_URL || 'https://cloud.uipath.com' }}
          UIPATH_SCOPE: ${{ vars.UIPATH_SCOPE || 'OR.Execution OR.Folders.Read' }}
          UIPATH_LIBRARY_FEED_ID: ${{ vars.UIPATH_LIBRARY_FEED_ID }}
          VERSION: ${{ needs.build.outputs.version }}
          VERIFY_CHECKSUM: ${{ vars.VERIFY_PACKAGE_CHECKSUM || 'true' }}
        run: |
          set -euo pipefail

          for v in UIPATH_CLIENT_ID UIPATH_CLIENT_SECRET UIPATH_ORG UIPATH_TENANT UIPATH_LIBRARY_FEED_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is empty for environment '${{ github.ref_name }}'"
              exit 1
            fi
          done

          uip login --authority "$UIPATH_URL" \
            --organization "$UIPATH_ORG" \
            --tenant "$UIPATH_TENANT" \
            --client-id "$UIPATH_CLIENT_ID" \
            --client-secret "$UIPATH_CLIENT_SECRET" \
            --scope "$UIPATH_SCOPE" \
            --output json

          KEY="${PACKAGE_NAME}:${VERSION}"
          ATTEMPTS=6

          # 1) The version must be found in the feed. Retry because feed
          #    indexing can take a few seconds after upload.
          for i in $(seq 1 "$ATTEMPTS"); do
            RC=0
            RESULT=$(uip or libraries get "$KEY" --feed-id "$UIPATH_LIBRARY_FEED_ID" --output json) || RC=$?
            if [ "$RC" -eq 0 ]; then break; fi

            # Exit 2 = auth error, 3 = validation error: retrying won't help.
            if [ "$RC" -ne 1 ]; then
              echo "$RESULT"
              echo "::error::uip or libraries get failed (exit $RC)"
              exit "$RC"
            fi

            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "Attempt $i/$ATTEMPTS: $KEY not found yet, retrying in 10 seconds..."
              sleep 10
            fi
          done

          if [ "$RC" -ne 0 ]; then
            echo "$RESULT"
            echo "::error::$KEY not found in feed $UIPATH_LIBRARY_FEED_ID"
            exit 1
          fi

          echo "$RESULT"

          # 2) The package ID and version returned by the feed must match exactly.
          ITEM=$(jq -c '.Data | if type == "array" then .[0] else . end' <<<"$RESULT")
          GOT_ID=$(jq -r '.Title // ((.Key // "") | split(":")[0])' <<<"$ITEM" | tr -d '\r')
          GOT_VERSION=$(jq -r '.Version // empty' <<<"$ITEM" | tr -d '\r')

          if [ "${GOT_ID,,}" != "${PACKAGE_NAME,,}" ] || [ "$GOT_VERSION" != "$VERSION" ]; then
            echo "::error::Feed returned '${GOT_ID}:${GOT_VERSION}', expected '$KEY'"
            exit 1
          fi

          # 3) The package content in the feed must be identical to this run's build output.
          CHECKSUM_INFO="skipped"
          if [ "$VERIFY_CHECKSUM" != "false" ]; then
            LOCAL="$(cygpath -m "$RUNNER_TEMP")/$OUTPUT_DIR/${PACKAGE_NAME}.${VERSION}.nupkg"
            REMOTE="$(cygpath -m "$RUNNER_TEMP")/feed-copy.nupkg"

            uip or libraries download "$KEY" --feed-id "$UIPATH_LIBRARY_FEED_ID" \
              --destination "$REMOTE" --output json >/dev/null

            LOCAL_SHA=$(sha256sum "$LOCAL" | cut -d' ' -f1)
            REMOTE_SHA=$(sha256sum "$REMOTE" | cut -d' ' -f1)

            if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
              echo "::error::Content of $KEY in the feed differs from this build (build $LOCAL_SHA, feed $REMOTE_SHA)."
              echo "::error::If this is a re-run, use 'Re-run failed jobs' so the same build artifact is reused. Otherwise bump projectVersion in project.json."
              exit 1
            fi
            CHECKSUM_INFO="match (sha256 $LOCAL_SHA)"
          fi

          {
            echo "### Package verified"
            echo "- Package: \`$KEY\`"
            echo "- Feed: \`$UIPATH_LIBRARY_FEED_ID\`"
            echo "- Checksum: $CHECKSUM_INFO"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------
  # TAG: create & confirm the release git tag (only after verification)
  # ---------------------------------------------------------
  tag-release:
    name: Confirm release tag
    needs: [build, verify-published-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create and confirm tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Print the commit SHA the tag points to; empty if the tag doesn't exist.
          resolve_tag() {
            local REF TYPE OBJ
            REF=$(gh api "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null) || return 0
            TYPE=$(jq -r '.object.type' <<<"$REF")
            OBJ=$(jq -r '.object.sha' <<<"$REF")
            # An annotated tag points to a tag object, not directly to a commit.
            if [ "$TYPE" = "tag" ]; then
              OBJ=$(gh api "repos/$REPO/git/tags/$OBJ" --jq '.object.sha')
            fi
            echo "$OBJ"
          }

          CURRENT=$(resolve_tag)

          if [ -z "$CURRENT" ]; then
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            echo "Created tag $TAG at $SHA"
            CURRENT=$(resolve_tag)
          else
            echo "::notice::Tag $TAG already exists"
          fi

          if [ "$CURRENT" != "$SHA" ]; then
            echo "::error::Tag $TAG points to '${CURRENT:-<none>}', expected $SHA"
            exit 1
          fi

          echo "Tag \`$TAG\` confirmed at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------
  # NOTIFY: tell consumer repos (.github/consumers.json)
  # ---------------------------------------------------------

  notify-consumers:
    name: Notify consumers
    needs: [build, tag-release]
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github

    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ secrets.BOT_APP_ID }}
        private-key: ${{ secrets.BOT_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}

    - name: Send repository_dispatch
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        VERSION: ${{ needs.build.outputs.version }}
        BRANCH: ${{ github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
          set -uo pipefail
          FILE=.github/consumers.json
          FAILED=0

          # 1) File must exist
          if [ ! -f "$FILE" ]; then
            echo "::error file=$FILE::$FILE not found – no consumers notified"
            exit 1
          fi

          # 2) File must be valid JSON with a consumers list
          if ! REPOS=$(jq -r --arg b "$BRANCH" \
                '.consumers[] | select((.enabled != false) and ((.branches // []) | index($b))) | .repo' \
                "$FILE" | tr -d '\r'); then
            echo "::error file=$FILE::$FILE is invalid or has no 'consumers' list"
            exit 1
          fi

          # 3) Nothing to notify for this branch → OK, but say so
          if [ -z "$REPOS" ]; then
            echo "No consumers subscribed to branch '$BRANCH'." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 4) Notify each repo (unchanged)
          for REPO in $REPOS; do
            if gh api "repos/$REPO/dispatches" \
                 -f event_type=taf-library-published \
                 -f "client_payload[version]=$VERSION" \
                 -f "client_payload[branch]=$BRANCH" \
                 -f "client_payload[runUrl]=$RUN_URL"; then
              echo "- ✓ $REPO" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ✗ $REPO" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            fi
          done

          exit $FAILED